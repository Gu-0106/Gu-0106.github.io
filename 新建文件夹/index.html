<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            color: black;
            overflow: hidden;
            height: 100vh;
        }

        /* 主页样式 */
        #home-page {
            width: 100%;
            height: 100vh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('image/jh.png');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            transition: opacity 0.8s ease-in-out;
        }

        .character {
            position: absolute;
            width: 150px;
            height: 200px;
            z-index: 10;
            /* 保持图片比例 */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* 男主角背景为人物图片 */
        #male-character {
            left: -150px;
            top: 50%;
            transform: translateY(-50%);
            background-image: url('image/nan.png'); /* 替换为你的男主角图片地址 */
            border-radius: 10px;
            animation: slideInLeft 2s forwards;
        }

        /* 女主角背景为人物图片 */
        #female-character {
            right: -150px;
            top: 50%;
            transform: translateY(-50%);
            background-image: url('image/nv.png'); /* 替换为你的女主角图片地址 */
            border-radius: 10px;
            animation: slideInRight 2s forwards;
        }

        @keyframes moveCenter {
            from {
                transform: translateY(-50%) translateX(0);
            }
            to {
                transform: translateY(-50%) translateX(0);
            }
        }

        @keyframes slideInLeft {
            from {
                left: -150px;
            }
            to {
                left: 20%;
            }
        }

        @keyframes slideInRight {
            from {
                right: -150px;
            }
            to {
                right: 20%;
            }
        }

        /* 修改开始按钮样式 - 解决跳动问题 */
        .start-btn {
            position: absolute;
            top: 45%;
            left: 50%;
            /* 合并translate和scale的初始状态，避免hover时重绘导致跳动 */
            transform: translate(-50%, -50%) scale(1);
            bottom: auto;
            width: 200px;
            height: 50px;
            background-color: transparent;
            color: #003366; 
            font-size: 50px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            z-index: 20;
            font-family: "Ma Shan Zheng", "Cao Shu", "华文草书", "STCaiyun", "LiSu", cursive, "Microsoft YaHei";
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            /* 关键：添加过渡动画到初始样式，确保状态切换平滑 */
            transition: all 0.3s ease;
        }

        /* 继续游戏按钮样式 */
        .continue-btn-home {
            position: absolute;
            top: 58%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            width: 200px;
            height: 50px;
            background-color: transparent;
            color: #006699; 
            font-size: 40px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            z-index: 20;
            font-family: "Ma Shan Zheng", "Cao Shu", "华文草书", "STCaiyun", "LiSu", cursive, "Microsoft YaHei";
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            /* 默认隐藏，有进度时显示 */
            display: none;
        }

        .continue-btn-home:hover {
            background-color: transparent;
            text-shadow: 2px 2px 4px rgba(0, 102, 153, 0.5);
            transform: translate(-50%, -50%) scale(1.05);
        }

        .start-btn:hover {
            background-color: transparent;
            text-shadow: 2px 2px 4px rgba(0, 51, 102, 0.5);
            /* 仅修改scale值，保留translate居中，避免位置偏移 */
            transform: translate(-50%, -50%) scale(1.05);
        }

        /* 游戏页面样式 */
        #game-page {
            width: 100%;
            height: 100vh;
            display: none;
            flex-direction: column;
            justify-content: space-between;
            padding: 0;
            position: relative;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        /* 终止游戏按钮样式 */
        .exit-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            width: 120px;
            height: 40px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .exit-btn:hover {
            background-color: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        /* 新增：回顾对话按钮样式 */
        .review-btn {
            position: absolute;
            top: 20px;
            right: 80px;
            z-index: 100;
            width: 120px;
            height: 40px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .review-btn:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        /* 新增：回顾对话面板样式 */
        .review-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .review-content {
            width: 80%;
            max-width: 800px;
            max-height: 80vh;
            background-color: white;
            border-radius: 15px;
            padding: 30px;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .review-close {
            position: sticky;
            top: 10px;
            left: calc(100% - 40px);
            width: 36px;
            height: 36px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            float: right;
        }

        .review-title {
            font-size: 24px;
            color: #003366;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .review-dialogue-item {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .review-character-name {
            font-weight: bold;
            font-size: 18px;
            color: #003366;
            margin-bottom: 5px;
        }

        .review-dialogue-text {
            font-size: 16px;
            line-height: 1.6;
            color: #333;
        }

        /* 场景容器 - 统一管理所有场景，实现平滑切换 */
        .scenes-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: all 1s ease-in-out;
            z-index: 1;
        }

        .scene.current-scene {
            opacity: 1;
            visibility: visible;
            z-index: 2;
        }

        /* 对话框放大 - 占页面1/3高度 + 圆角设计 */
        .dialogue-container {
            position: absolute;
            bottom: 0;
            left: 0;
            transform: none;
            width: 100%;
            height: 33.33vh;
            background-color: rgba(255, 255, 255, 0.95);
            /* 关键修改：添加圆角，只保留顶部圆角更符合底部对话框的视觉效果 */
            border-radius: 20px 20px 0 0;
            padding: 30px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            /* 对话框淡入动画 */
            opacity: 1;
            transition: opacity 0.5s ease-in-out;
        }

        /* 对话隐藏状态 */
        .dialogue-hidden {
            opacity: 0;
            pointer-events: none;
        }

        .character-info {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        /* 同时替换对话中的头像图片 */
        .character-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin-right: 20px;
            /* 头像图片样式 */
            background-size: cover;
            background-position: center;
        }

        /* 男主角头像 */
        #male-avatar {
            background-image: url('image/nan.png'); /* 替换为男主头像地址 */
        }

        /* 女主角头像 */
        #female-avatar {
            background-image: url('image/nv.png'); /* 替换为女主头像地址 */
        }

        .character-name {
            font-weight: bold;
            font-size: 24px;
            color: #003366;
        }

        .dialogue-text {
            font-size: 20px;
            line-height: 1.8;
            color: #333;
            margin-bottom: 20px;
            flex: 1;
            display: flex;
            align-items: center;
        }

        /* 分支选项样式 */
        .options-container {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }

        .option-btn {
            flex: 1;
            height: 60px;
            background-color: #003366;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            padding: 0 20px;
            transition: all 0.3s ease;
        }

        .option-btn:hover {
            background-color: #005599;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .continue-btn {
            width: 150px;
            height: 50px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            align-self: flex-end;
            transition: all 0.3s ease;
        }

        .continue-btn:hover {
            background-color: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        /* 结束游戏按钮样式 */
        .end-game-btn {
            width: 150px;
            height: 50px;
            background-color: #9C27B0;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            align-self: flex-end;
            margin-left: 15px;
            transition: all 0.3s ease;
        }

        .end-game-btn:hover {
            background-color: #7B1FA2;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        /* 按钮容器 - 用于并排显示重新开始和结束游戏按钮 */
        .btn-container {
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        /* 每个篇章独立背景图 - 统一管理背景切换 */
        .scene-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: opacity 1.2s ease-in-out;
            z-index: 0;
        }

        /* 场景1：破庙避雪 背景 */
        #bg-scene1 {
            background-image: url('image/亭.png'); /* 替换为破庙避雪背景图 */
            opacity: 1;
        }

        /* 场景2：客栈遇袭后 背景 */
        #bg-scene2 {
            background-image: url('image/竹林.png'); /* 替换为客栈遇袭背景图 */
            opacity: 0;
        }

        /* 场景3：渡口送别 背景 */
        #bg-scene3 {
            background-image: url('image/山.png'); /* 替换为渡口送别背景图 */
            opacity: 0;
        }

        /* 音乐控制按钮样式（优化版：去掉圆圈） */
        .music-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        .mute-btn {
            width: auto;
            height: auto;
            background-color: transparent;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5px;
            transition: all 0.3s ease;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .mute-btn:hover {
            color: #f0f0f0;
            transform: scale(1.1);
            text-shadow: 0 3px 6px rgba(0,0,0,0.7);
        }

        .mute-btn:active {
            transform: scale(0.95);
        }

        /* 加载过渡遮罩 */
        .transition-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 99;
            opacity: 0;
            visibility: hidden;
            transition: all 0.6s ease-in-out;
        }

        .transition-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* 结尾画面样式 */
        #end-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-image: url('image/山.png'); /* 使用场景3的背景图 */
            background-size: cover;
            background-position: center;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            z-index: 1000;
        }

        .end-text {
            font-family: "Ma Shan Zheng", "Cao Shu", "华文草书", "STCaiyun", "LiSu", cursive, "Microsoft YaHei";
            font-size: 120px;
            color: white;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8);
            animation: fadeInScale 2s ease-in-out;
            text-align: center;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* 返回主页按钮 */
        .back-home-btn {
            position: absolute;
            bottom: 50px;
            width: 180px;
            height: 50px;
            background-color: rgba(0, 51, 102, 0.8);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 20px;
            font-family: "Ma Shan Zheng", cursive;
            transition: all 0.3s ease;
            opacity: 0;
            animation: fadeIn 3s ease-in-out 1s forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .back-home-btn:hover {
            background-color: rgba(0, 51, 102, 1);
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .character {
                width: 100px;
                height: 150px;
            }

            #male-character {
                left: -100px;
            }

            #female-character {
                right: -100px;
            }

            /* 响应式调整开始按钮 - 同步修复跳动 */
            .start-btn {
                width: 150px;
                height: 40px;
                font-size: 30px;
                top: 45%;
                left: 50%;
                transform: translate(-50%, -50%) scale(1);
                bottom: auto;
                color: #003366;
                transition: all 0.3s ease;
            }
            
            /* 响应式调整继续游戏按钮 */
            .continue-btn-home {
                width: 150px;
                height: 40px;
                font-size: 28px;
                top: 58%;
                left: 50%;
                transform: translate(-50%, -50%) scale(1);
            }

            .start-btn:hover {
                transform: translate(-50%, -50%) scale(1.05);
            }

            /* 响应式调整对话框 */
            .dialogue-container {
                height: 33.33vh;
                padding: 20px;
                /* 响应式调整圆角大小 */
                border-radius: 15px 15px 0 0;
            }

            .character-avatar {
                width: 50px;
                height: 50px;
            }

            .character-name {
                font-size: 20px;
            }

            .dialogue-text {
                font-size: 18px;
            }

            .option-btn {
                height: 50px;
                font-size: 16px;
            }

            .continue-btn {
                width: 120px;
                height: 45px;
                font-size: 16px;
            }

            .end-game-btn {
                width: 120px;
                height: 45px;
                font-size: 16px;
                margin-left: 10px;
            }
            
            /* 响应式调整终止按钮 */
            .exit-btn {
                width: 100px;
                height: 35px;
                font-size: 14px;
                top: 15px;
                left: 15px;
            }
            
            /* 响应式调整回顾按钮 */
            .review-btn {
                width: 100px;
                height: 35px;
                font-size: 14px;
                top: 15px;
                right: 70px;
            }
            
            .music-controls {
                top: 15px;
                right: 15px;
            }
            
            .mute-btn {
                font-size: 24px;
                padding: 4px;
            }

            /* 响应式调整回顾面板 */
            .review-content {
                width: 90%;
                padding: 20px;
            }
            
            .review-title {
                font-size: 20px;
            }
            
            .review-character-name {
                font-size: 16px;
            }
            
            .review-dialogue-text {
                font-size: 14px;
            }

            /* 响应式调整结尾文字 */
            .end-text {
                font-size: 80px;
            }

            .back-home-btn {
                width: 150px;
                height: 45px;
                font-size: 18px;
                bottom: 40px;
            }
        }

        @media (max-width: 480px) {
            .character {
                width: 80px;
                height: 120px;
            }

            /* 响应式调整开始按钮 - 同步修复跳动 */
            .start-btn {
                width: 120px;
                height: 35px;
                font-size: 24px;
                top: 45%;
                left: 50%;
                transform: translate(-50%, -50%) scale(1);
                bottom: auto;
                color: #003366;
                transition: all 0.3s ease;
            }
            
            /* 响应式调整继续游戏按钮 */
            .continue-btn-home {
                width: 120px;
                height: 35px;
                font-size: 22px;
                top: 58%;
                left: 50%;
                transform: translate(-50%, -50%) scale(1);
            }

            .start-btn:hover {
                transform: translate(-50%, -50%) scale(1.05);
            }

            /* 响应式调整对话框 */
            .dialogue-container {
                height: 33.33vh;
                padding: 15px;
                /* 响应式调整圆角大小 */
                border-radius: 12px 12px 0 0;
            }

            .character-avatar {
                width: 40px;
                height: 40px;
            }

            .character-name {
                font-size: 18px;
            }

            .dialogue-text {
                font-size: 16px;
            }

            .options-container {
                flex-direction: column;
                gap: 10px;
            }

            .option-btn {
                height: 45px;
                font-size: 14px;
            }

            .continue-btn {
                width: 100px;
                height: 40px;
                font-size: 14px;
            }

            .end-game-btn {
                width: 100px;
                height: 40px;
                font-size: 14px;
                margin-left: 8px;
            }
            
            /* 响应式调整终止按钮 */
            .exit-btn {
                width: 90px;
                height: 30px;
                font-size: 12px;
                top: 10px;
                left: 10px;
            }
            
            /* 响应式调整回顾按钮 */
            .review-btn {
                width: 90px;
                height: 30px;
                font-size: 12px;
                top: 10px;
                right: 60px;
            }
            
            .music-controls {
                top: 10px;
                right: 10px;
            }
            
            .mute-btn {
                font-size: 22px;
                padding: 3px;
            }

            /* 响应式调整回顾面板 */
            .review-content {
                width: 95%;
                padding: 15px;
            }
            
            .review-title {
                font-size: 18px;
            }
            
            .review-character-name {
                font-size: 14px;
            }
            
            .review-dialogue-text {
                font-size: 13px;
            }
            
            .review-close {
                width: 32px;
                height: 32px;
                font-size: 16px;
            }

            /* 响应式调整结尾文字 */
            .end-text {
                font-size: 50px;
            }

            .back-home-btn {
                width: 120px;
                height: 40px;
                font-size: 16px;
                bottom: 30px;
            }
        }
    </style>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Cao Shu';
            src: url('https://cdn.jsdelivr.net/npm/chinese-fonts/fonts/CaoShu.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
    </style>
</head>
<body>
    <!-- 主页 -->
    <div id="home-page">
        <audio id="bg-music" loop>
            <source src="music/归零.mp3" type="audio/mpeg">
        </audio>
        
        <div class="music-controls">
            <button class="mute-btn" id="muteBtn" title="静音/取消静音">🔊</button>
        </div>
        
        <div class="character" id="male-character"></div>
        <div class="character" id="female-character"></div>
        
        <button class="start-btn" onclick="startGame(true)">开始游戏</button>

    <script>
        const bgMusic = document.getElementById('bg-music');
        const muteBtn = document.getElementById('muteBtn');
        const gameMuteBtn = document.getElementById('gameMuteBtn');
        const transitionOverlay = document.getElementById('transitionOverlay');
        const homePage = document.getElementById('home-page');
        const gamePage = document.getElementById('game-page');
        const continueBtnHome = document.getElementById('continueBtnHome');
        // 新增：回顾对话相关元素
        const reviewPanel = document.getElementById('reviewPanel');
        const reviewDialoguesContainer = document.getElementById('reviewDialoguesContainer');
        // 新增：结尾画面元素
        const endScreen = document.getElementById('end-screen');
        
        let isMuted = false;
        let isTransitioning = false;
        // 新增：存储对话历史记录
        let dialogueHistory = [];
        
        // 进度存储相关常量
        const PROGRESS_KEY = 'game_progress';
        // 新增：对话历史存储key
        const DIALOGUE_HISTORY_KEY = 'dialogue_history';
        
        // 初始化 - 检查是否有保存的进度
        window.addEventListener('load', function() {
            homePage.style.opacity = '1';
            
            // 检查并显示继续游戏按钮
            const savedProgress = getGameProgress();
            if (savedProgress) {
                continueBtnHome.style.display = 'block';
                // 加载保存的对话历史
                loadDialogueHistory();
            }
            
            setTimeout(() => {
                if (!isMuted) {
                    bgMusic.play().catch(e => console.log("音频播放失败:", e));
                }
            }, 100);
        });
        
        // 保存游戏进度
        function saveGameProgress(progress) {
            localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
            // 更新首页继续游戏按钮显示
            continueBtnHome.style.display = progress ? 'block' : 'none';
        }
        
        // 获取游戏进度
        function getGameProgress() {
            const progress = localStorage.getItem(PROGRESS_KEY);
            return progress ? JSON.parse(progress) : null;
        }
        
        // 清除游戏进度
        function clearGameProgress() {
            localStorage.removeItem(PROGRESS_KEY);
            localStorage.removeItem(DIALOGUE_HISTORY_KEY); // 同时清除对话历史
            dialogueHistory = [];
            continueBtnHome.style.display = 'none';
        }
        
        // 新增：保存对话历史
        function saveDialogueHistory() {
            localStorage.setItem(DIALOGUE_HISTORY_KEY, JSON.stringify(dialogueHistory));
        }
        
        // 新增：加载对话历史
        function loadDialogueHistory() {
            const history = localStorage.getItem(DIALOGUE_HISTORY_KEY);
            if (history) {
                dialogueHistory = JSON.parse(history);
            }
        }
        
        // 新增：添加对话到历史记录
        function addToDialogueHistory(characterName, dialogueText) {
            dialogueHistory.push({
                character: characterName,
                text: dialogueText,
                timestamp: new Date().getTime()
            });
            saveDialogueHistory();
        }
        
        // 静音控制
        function toggleMute() {
            isMuted = !isMuted;
            bgMusic.muted = isMuted;
            updateMuteButtonDisplay();
        }
        
        function updateMuteButtonDisplay() {
            const icon = isMuted ? '🔇' : '🔊';
            const title = isMuted ? '取消静音' : '静音';
            muteBtn.textContent = icon;
            muteBtn.title = title;
            gameMuteBtn.textContent = icon;
            gameMuteBtn.title = title;
        }
        
        function setupMuteButton(button) {
            button.addEventListener('click', toggleMute);
        }
        
        setupMuteButton(muteBtn);
        setupMuteButton(gameMuteBtn);
        
        // 开始游戏 - 平滑过渡 (isNewGame: 是否是新游戏)
        function startGame(isNewGame = true) {
            if (isTransitioning) return;
            isTransitioning = true;
            
            // 新游戏清除进度
            if (isNewGame) {
                clearGameProgress();
            }
            
            // 主页淡出
            homePage.style.opacity = '0';
            
            setTimeout(() => {
                homePage.style.display = 'none';
                gamePage.style.display = 'flex';
                
                // 游戏页面淡入
                setTimeout(() => {
                    gamePage.style.opacity = '1';
                    isTransitioning = false;
                    
                    if (!isMuted) {
                        bgMusic.play().catch(e => console.log("音频播放失败:", e));
                    }
                }, 100);
            }, 800);
        }

        // 继续游戏 - 恢复上次进度
        function continueGame() {
            const savedProgress = getGameProgress();
            if (!savedProgress) return;
            
            // 开始游戏（不清除进度）
            startGame(false);
            
            // 等待游戏页面加载完成后恢复进度
            setTimeout(() => {
                // 重置所有场景和背景
                resetAllScenes();
                
                // 恢复场景
                const { scene, dialogue, bgOpacity } = savedProgress;
                
                // 切换背景
                Object.keys(bgOpacity).forEach(bgId => {
                    document.getElementById(bgId).style.opacity = bgOpacity[bgId];
                });
                
                // 激活对应场景
                document.getElementById(`scene${scene}`).classList.add('current-scene');
                
                // 显示对应对话
                document.getElementById(`scene${scene}-dialogue${dialogue}`).classList.remove('dialogue-hidden');
                
            }, 900);
        }

        // 终止游戏 - 返回首页并保存进度
        function exitGame() {
            if (isTransitioning) return;
            isTransitioning = true;
            
            // 显示过渡遮罩
            transitionOverlay.classList.add('active');
            
            // 保存当前进度
            saveCurrentProgress();
            
            setTimeout(() => {
                // 游戏页面淡出
                gamePage.style.opacity = '0';
                
                setTimeout(() => {
                    gamePage.style.display = 'none';
                    homePage.style.display = 'flex';
                    
                    // 主页淡入
                    setTimeout(() => {
                        homePage.style.opacity = '1';
                        transitionOverlay.classList.remove('active');
                        isTransitioning = false;
                    }, 100);
                }, 800);
            }, 600);
        }

        // 保存当前游戏进度
        function saveCurrentProgress() {
            // 找到当前激活的场景
            const currentSceneEl = document.querySelector('.scene.current-scene');
            if (!currentSceneEl) return;
            
            const sceneNum = currentSceneEl.id.replace('scene', '');
            
            // 找到当前显示的对话
            let dialogueNum = 1;
            const dialogueContainers = currentSceneEl.querySelectorAll('.dialogue-container');
            dialogueContainers.forEach((container, index) => {
                if (!container.classList.contains('dialogue-hidden')) {
                    dialogueNum = index + 1;
                }
            });
            
            // 保存背景透明度
            const bgOpacity = {
                'bg-scene1': document.getElementById('bg-scene1').style.opacity || '1',
                'bg-scene2': document.getElementById('bg-scene2').style.opacity || '0',
                'bg-scene3': document.getElementById('bg-scene3').style.opacity || '0'
            };
            
            // 保存进度
            saveGameProgress({
                scene: sceneNum,
                dialogue: dialogueNum,
                bgOpacity: bgOpacity
            });
        }

        // 重置所有场景状态
        function resetAllScenes() {
            // 隐藏所有场景
            const scenes = document.querySelectorAll('.scene');
            scenes.forEach(scene => {
                scene.classList.remove('current-scene');
            });
            
            // 隐藏所有对话
            const allDialogues = document.querySelectorAll('.dialogue-container');
            allDialogues.forEach(dialogue => {
                dialogue.classList.add('dialogue-hidden');
            });
        }

        // 场景1分支选择
        function chooseScene1Option1() {
            // 记录当前对话到历史
            addToDialogueHistory('男主角', '他燃着柴火，递来半块热饼：“雪没停，你伤势未愈，今夜先在此落脚。”');
            
            document.getElementById('scene1-dialogue1').classList.add('dialogue-hidden');
            setTimeout(() => {
                document.getElementById('scene1-dialogue2').classList.remove('dialogue-hidden');
                // 记录分支对话到历史
                addToDialogueHistory('男主角', '他垂眸笑：“举手之劳，护你周全，本就该当。”');
                // 保存进度
                saveCurrentProgress();
            }, 300);
        }
        
        function chooseScene1Option2() {
            // 记录当前对话到历史
            addToDialogueHistory('男主角', '他燃着柴火，递来半块热饼：“雪没停，你伤势未愈，今夜先在此落脚。”');
            
            document.getElementById('scene1-dialogue1').classList.add('dialogue-hidden');
            setTimeout(() => {
                document.getElementById('scene1-dialogue3').classList.remove('dialogue-hidden');
                // 记录分支对话到历史
                addToDialogueHistory('男主角', '他挑眉抬眸：“你在哪，我便在哪，不急。”');
                // 保存进度
                saveCurrentProgress();
            }, 300);
        }

        // 场景2分支选择
        function chooseScene2Option1() {
            // 记录当前对话到历史
            addToDialogueHistory('男主角', '他擦去剑上血珠，看向你：“吓到了？方才不该让你站在身后。”');
            
            document.getElementById('scene2-dialogue1').classList.add('dialogue-hidden');
            setTimeout(() => {
                document.getElementById('scene2-dialogue2').classList.remove('dialogue-hidden');
                // 记录分支对话到历史
                addToDialogueHistory('男主角', '他收剑入鞘，揉你发顶：“放心，我不会有事。”');
                // 保存进度
                saveCurrentProgress();
            }, 300);
        }
        
        function chooseScene2Option2() {
            // 记录当前对话到历史
            addToDialogueHistory('男主角', '他擦去剑上血珠，看向你：“吓到了？方才不该让你站在身后。”');
            
            document.getElementById('scene2-dialogue1').classList.add('dialogue-hidden');
            setTimeout(() => {
                document.getElementById('scene2-dialogue3').classList.remove('dialogue-hidden');
                // 记录分支对话到历史
                addToDialogueHistory('男主角', '他轻捏你手腕：“胡说，有你在，我才更分心护着。”');
                // 保存进度
                saveCurrentProgress();
            }, 300);
        }

        // 场景3分支选择
        function chooseScene3Option1() {
            // 记录当前对话到历史
            addToDialogueHistory('男主角', '他立在船头，衣袂翻飞：“此去凶险，我留你在江南，等我回来。”');
            
            document.getElementById('scene3-dialogue1').classList.add('dialogue-hidden');
            setTimeout(() => {
                document.getElementById('scene3-dialogue2').classList.remove('dialogue-hidden');
                // 记录分支对话到历史
                addToDialogueHistory('男主角', '他扬唇挥手：“定不负你，归来必陪你看遍江南春。”');
                // 保存进度
                saveCurrentProgress();
            }, 300);
        }
        
        function chooseScene3Option2() {
            // 记录当前对话到历史
            addToDialogueHistory('男主角', '他立在船头，衣袂翻飞：“此去凶险，我留你在江南，等我回来。”');
            
            document.getElementById('scene3-dialogue1').classList.add('dialogue-hidden');
            setTimeout(() => {
                document.getElementById('scene3-dialogue3').classList.remove('dialogue-hidden');
                // 记录分支对话到历史
                addToDialogueHistory('男主角', '他眸色沉了沉，却带笑意：“傻丫头，那便握紧我，别松手。”');
                // 保存进度
                saveCurrentProgress();
            }, 300);
        }

        // 场景切换 - 平滑过渡
        function nextScene(currentScene) {
            if (isTransitioning) return;
            isTransitioning = true;
            
            // 保存当前进度
            saveCurrentProgress();
            
            // 显示过渡遮罩
            transitionOverlay.classList.add('active');
            
            // 隐藏当前场景的对话
            const currentDialogues = document.querySelectorAll(`#scene${currentScene} .dialogue-container`);
            currentDialogues.forEach(dialogue => {
                dialogue.classList.add('dialogue-hidden');
            });
            
            setTimeout(() => {
                // 隐藏当前场景
                document.getElementById(`scene${currentScene}`).classList.remove('current-scene');
                
                // 显示下一个场景
                const nextSceneNum = currentScene + 1;
                if(document.getElementById(`scene${nextSceneNum}`)) {
                    // 切换背景图
                    document.getElementById(`bg-scene${currentScene}`).style.opacity = '0';
                    document.getElementById(`bg-scene${nextSceneNum}`).style.opacity = '1';
                    
                    // 显示下一场景
                    document.getElementById(`scene${nextSceneNum}`).classList.add('current-scene');
                    
                    // 显示下一场景的初始对话
                    setTimeout(() => {
                        document.getElementById(`scene${nextSceneNum}-dialogue1`).classList.remove('dialogue-hidden');
                        
                        // 保存新进度
                        saveCurrentProgress();
                        
                        // 隐藏过渡遮罩
                        setTimeout(() => {
                            transitionOverlay.classList.remove('active');
                            isTransitioning = false;
                        }, 500);
                    }, 600);
                }
            }, 600);
        }

        // 重新开始游戏 - 平滑过渡
        function restartGame() {
            if (isTransitioning) return;
            isTransitioning = true;
            
            // 清除进度
            clearGameProgress();
            
            // 显示过渡遮罩
            transitionOverlay.classList.add('active');
            
            // 隐藏所有场景
            const scenes = document.querySelectorAll('.scene');
            scenes.forEach(scene => {
                scene.classList.remove('current-scene');
            });
            
            // 重置背景图
            document.getElementById('bg-scene1').style.opacity = '1';
            document.getElementById('bg-scene2').style.opacity = '0';
            document.getElementById('bg-scene3').style.opacity = '0';
            
            setTimeout(() => {
                // 重置所有对话
                const allDialogues = document.querySelectorAll('.dialogue-container');
                allDialogues.forEach((dialogue, index) => {
                    dialogue.classList.add('dialogue-hidden');
                });
                
                // 重置场景1
                document.getElementById('scene1').classList.add('current-scene');
                document.getElementById('scene1-dialogue1').classList.remove('dialogue-hidden');
                
                // 游戏页面淡出
                gamePage.style.opacity = '0';
                
                setTimeout(() => {
                    gamePage.style.display = 'none';
                    homePage.style.display = 'flex';
                    
                    // 主页淡入
                    setTimeout(() => {
                        homePage.style.opacity = '1';
                        transitionOverlay.classList.remove('active');
                        isTransitioning = false;
                        
                        if (!isMuted) {
                            bgMusic.play().catch(e => console.log("音频播放失败:", e));
                        }
                    }, 100);
                }, 800);
            }, 800);
        }

        // 新增：打开回顾对话面板
        function openReviewPanel() {
            reviewPanel.style.display = 'flex';
            renderDialogueHistory();
        }

        // 新增：关闭回顾对话面板
        function closeReviewPanel() {
            reviewPanel.style.display = 'none';
        }

        // 新增：渲染对话历史到面板
        function renderDialogueHistory() {
            if (dialogueHistory.length === 0) {
                reviewDialoguesContainer.innerHTML = '<div style="text-align:center; color:#666; padding:20px;">暂无对话记录</div>';
                return;
            }
            
            // 清空容器
            reviewDialoguesContainer.innerHTML = '';
            
            // 按时间顺序渲染对话
            dialogueHistory.forEach((item, index) => {
                const dialogueItem = document.createElement('div');
                dialogueItem.className = 'review-dialogue-item';
                
                const characterName = document.createElement('div');
                characterName.className = 'review-character-name';
                characterName.textContent = item.character;
                
                const dialogueText = document.createElement('div');
                dialogueText.className = 'review-dialogue-text';
                dialogueText.textContent = item.text;
                
                dialogueItem.appendChild(characterName);
                dialogueItem.appendChild(dialogueText);
                reviewDialoguesContainer.appendChild(dialogueItem);
            });
            
            // 滚动到底部（最新对话）
            reviewDialoguesContainer.scrollTop = reviewDialoguesContainer.scrollHeight;
        }

        // 点击面板外部关闭
        reviewPanel.addEventListener('click', function(e) {
            if (e.target === reviewPanel) {
                closeReviewPanel();
            }
        });

        // ESC键关闭面板
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && reviewPanel.style.display === 'flex') {
                closeReviewPanel();
            }
        });

        // 新增：显示结尾画面
        function showEndScreen() {
            if (isTransitioning) return;
            isTransitioning = true;
            
            // 隐藏游戏页面
            gamePage.style.opacity = '0';
            
            setTimeout(() => {
                gamePage.style.display = 'none';
                endScreen.style.display = 'flex';
                
                setTimeout(() => {
                    endScreen.style.opacity = '1';
                    isTransitioning = false;
                }, 100);
            }, 800);
        }

        // 新增：返回主页
        function backToHome() {
            if (isTransitioning) return;
            isTransitioning = true;
            
            // 清除游戏进度
            clearGameProgress();
            
            // 结尾画面淡出
            endScreen.style.opacity = '0';
            
            setTimeout(() => {
                endScreen.style.display = 'none';
                homePage.style.display = 'flex';
                
                setTimeout(() => {
                    homePage.style.opacity = '1';
                    isTransitioning = false;
                    
                    if (!isMuted) {
                        bgMusic.play().catch(e => console.log("音频播放失败:", e));
                    }
                }, 100);
            }, 800);
        }
    </script>
</body>
</html>
